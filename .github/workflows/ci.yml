name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w @dn/api
      - run: npm run build

  # Render can't see pushes to this repo (its GitHub app isn't installed), so CI triggers the deploy
  # after the build passes. Skipped when the secrets aren't set (e.g. on forks).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger Render deploy of this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The web app deploys on Vercel; a push that only touches apps/web or docs needn't restart the API.
          if git cat-file -e "$BEFORE" 2>/dev/null && \
             ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^(apps/web/|docs/|README\.md)'; then
            echo "Only web/docs changed; skipping API deploy."
            exit 0
          fi
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets not configured; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$GITHUB_SHA\"}" -o /dev/null
          echo "Deploy of $GITHUB_SHA requested."
